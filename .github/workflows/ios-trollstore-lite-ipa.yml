name: Build iOS TrollStore Lite IPA

on:
  workflow_dispatch:
  push:
    branches:
      - bot/ios-ipa-artifact
    paths:
      - '.github/workflows/ios-trollstore-lite-ipa.yml'
      - 'apps/ios/project.trollstore-lite.yml'
      - 'apps/ios/**'
      - 'scripts/ios-*.sh'
      - 'packages/**'
      - 'Swabble/**'
      - 'pnpm-lock.yaml'
      - 'package.json'

jobs:
  build-ios-trollstore-lite-ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version
          swift --version

      - name: Install iOS build tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Install dependencies
        run: |
          TMP_TLON_DIR="$RUNNER_TEMP/tlon-disabled"
          rm -rf "$TMP_TLON_DIR"
          if [ -d extensions/tlon ]; then
            mv extensions/tlon "$TMP_TLON_DIR"
          fi
          git config --global --add url."https://github.com/".insteadOf git@github.com:
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf https://git@github.com:
          pnpm install --frozen-lockfile

      - name: Generate TrollStore Lite iOS project
        run: |
          ./scripts/ios-write-version-xcconfig.sh
          OPENCLAW_IOS_BUNDLE_ID_BASE=ai.openclaw.ios.gha \
          OPENCLAW_IOS_SHARE_BUNDLE_ID=ai.openclaw.ios.gha.share \
          OPENCLAW_IOS_ACTIVITY_WIDGET_BUNDLE_ID=ai.openclaw.ios.gha.activitywidget \
          OPENCLAW_IOS_WATCH_APP_BUNDLE_ID=ai.openclaw.ios.gha.watchkitapp \
          OPENCLAW_IOS_WATCH_EXTENSION_BUNDLE_ID=ai.openclaw.ios.gha.watchkitapp.extension \
          OPENCLAW_IOS_CODE_SIGN_STYLE=Automatic \
          ./scripts/ios-configure-signing.sh || true
          cd apps/ios
          cp project.trollstore-lite.yml project.generated.trollstore-lite.yml
          xcodegen generate --spec project.generated.trollstore-lite.yml

      - name: Build TrollStore Lite unsigned iphoneos app
        run: |
          cd apps/ios
          xcodebuild \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-TrollStoreLite \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Locate app bundle
        id: locate
        run: |
          APP_PATH=$(find apps/ios/build/DerivedData-TrollStoreLite/Build/Products -type d -name 'OpenClaw.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo 'OpenClaw.app not found' >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP_PATH"

      - name: Inspect app metadata before repack
        run: |
          APP_PATH='${{ steps.locate.outputs.app_path }}'
          echo '--- Info.plist ---'
          /usr/libexec/PlistBuddy -c 'Print' "$APP_PATH/Info.plist" || true
          echo '--- entitlements via codesign ---'
          codesign -d --entitlements :- "$APP_PATH" || true
          echo '--- embedded provisioning ---'
          ls -la "$APP_PATH" | sed 's#^#  #' || true

      - name: Strip extensions, watch content, signatures, provisioning, plist keys
        run: |
          APP_PATH='${{ steps.locate.outputs.app_path }}'
          echo "Before strip:"
          find "$APP_PATH" -maxdepth 2 \( -type d -o -type f \) | sed 's#^#  #' | sort
          rm -rf "$APP_PATH/PlugIns" "$APP_PATH/Watch"
          find "$APP_PATH" -name '*.appex' -prune -exec rm -rf {} + || true
          find "$APP_PATH" -name '*.app' -path '*/Watch/*' -prune -exec rm -rf {} + || true
          rm -f "$APP_PATH/embedded.mobileprovision"
          find "$APP_PATH" -name '_CodeSignature' -type d -prune -exec rm -rf {} + || true
          find "$APP_PATH" -name 'CodeResources' -type f -delete || true
          /usr/libexec/PlistBuddy -c 'Delete :NSSupportsLiveActivities' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Delete :OpenClawPushTransport' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Delete :OpenClawPushDistribution' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Delete :OpenClawPushRelayBaseURL' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Delete :OpenClawPushAPNsEnvironment' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Delete :UIBackgroundModes:1' "$APP_PATH/Info.plist" || true
          if [ -f "$APP_PATH/archived-expanded-entitlements.xcent" ]; then
            rm -f "$APP_PATH/archived-expanded-entitlements.xcent"
          fi
          echo "After strip:"
          find "$APP_PATH" -maxdepth 2 \( -type d -o -type f \) | sed 's#^#  #' | sort
          echo '--- Final Info.plist ---'
          /usr/libexec/PlistBuddy -c 'Print' "$APP_PATH/Info.plist" || true

      - name: Package TrollStore Lite IPA
        run: |
          rm -rf out-trollstore-lite
          mkdir -p out-trollstore-lite/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" out-trollstore-lite/Payload/OpenClaw.app
          cd out-trollstore-lite
          /usr/bin/zip -qry ../OpenClaw-trollstore-lite-iphoneos.ipa Payload
          cd ..
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.locate.outputs.app_path }}" OpenClaw-trollstore-lite-app-bundle.zip

      - name: Upload TrollStore Lite IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-ios-trollstore-lite-ipa
          path: |
            OpenClaw-trollstore-lite-iphoneos.ipa
            OpenClaw-trollstore-lite-app-bundle.zip
          if-no-files-found: error
