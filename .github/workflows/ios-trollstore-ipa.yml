name: Build iOS TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - bot/ios-ipa-artifact
    paths:
      - '.github/workflows/ios-trollstore-ipa.yml'
      - 'apps/ios/project.trollstore.yml'
      - 'apps/ios/**'
      - 'scripts/ios-*.sh'
      - 'packages/**'
      - 'Swabble/**'
      - 'pnpm-lock.yaml'
      - 'package.json'

jobs:
  build-ios-trollstore-ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version
          swift --version

      - name: Install iOS build tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Install dependencies
        run: |
          TMP_TLON_DIR="$RUNNER_TEMP/tlon-disabled"
          rm -rf "$TMP_TLON_DIR"
          if [ -d extensions/tlon ]; then
            mv extensions/tlon "$TMP_TLON_DIR"
          fi
          git config --global --add url."https://github.com/".insteadOf git@github.com:
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf https://git@github.com:
          pnpm install --frozen-lockfile

      - name: Generate TrollStore iOS project
        run: |
          ./scripts/ios-write-version-xcconfig.sh
          OPENCLAW_IOS_BUNDLE_ID_BASE=ai.openclaw.ios.gha \
          OPENCLAW_IOS_SHARE_BUNDLE_ID=ai.openclaw.ios.gha.share \
          OPENCLAW_IOS_ACTIVITY_WIDGET_BUNDLE_ID=ai.openclaw.ios.gha.activitywidget \
          OPENCLAW_IOS_WATCH_APP_BUNDLE_ID=ai.openclaw.ios.gha.watchkitapp \
          OPENCLAW_IOS_WATCH_EXTENSION_BUNDLE_ID=ai.openclaw.ios.gha.watchkitapp.extension \
          OPENCLAW_IOS_CODE_SIGN_STYLE=Automatic \
          ./scripts/ios-configure-signing.sh || true
          cd apps/ios
          cp project.trollstore.yml project.generated.trollstore.yml
          xcodegen generate --spec project.generated.trollstore.yml

      - name: Build TrollStore-focused unsigned iphoneos app
        run: |
          cd apps/ios
          xcodebuild \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-TrollStore \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Locate app bundle
        id: locate
        run: |
          APP_PATH=$(find apps/ios/build/DerivedData-TrollStore/Build/Products -type d -name 'OpenClaw.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo 'OpenClaw.app not found' >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP_PATH"

      - name: Strip extensions and watch content for TrollStore
        run: |
          APP_PATH='${{ steps.locate.outputs.app_path }}'
          echo "Before strip:"
          find "$APP_PATH" -maxdepth 2 \( -type d -o -type f \) | sed 's#^#  #' | sort
          rm -rf "$APP_PATH/PlugIns" "$APP_PATH/Watch"
          find "$APP_PATH" -name '*.appex' -prune -exec rm -rf {} + || true
          find "$APP_PATH" -name '*.app' -path '*/Watch/*' -prune -exec rm -rf {} + || true
          echo "After strip:"
          find "$APP_PATH" -maxdepth 2 \( -type d -o -type f \) | sed 's#^#  #' | sort

      - name: Package TrollStore IPA
        run: |
          rm -rf out-trollstore
          mkdir -p out-trollstore/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" out-trollstore/Payload/OpenClaw.app
          cd out-trollstore
          /usr/bin/zip -qry ../OpenClaw-trollstore-iphoneos.ipa Payload
          cd ..
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.locate.outputs.app_path }}" OpenClaw-trollstore-app-bundle.zip

      - name: Upload TrollStore IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-ios-trollstore-ipa
          path: |
            OpenClaw-trollstore-iphoneos.ipa
            OpenClaw-trollstore-app-bundle.zip
          if-no-files-found: error
